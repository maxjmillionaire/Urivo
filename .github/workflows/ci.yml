name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      # The unit suite runs here too. It did not, which meant the pricing-drift
      # and entitlement tests — written precisely because those failures are
      # silent — were only ever run by hand. `npm test` uses vitest.config.ts and
      # cannot reach the integration suite: that one needs a real database and is
      # gated behind `npm run test:db` plus URIVO_INTEGRATION_DB=1.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Public env is inlined at build; placeholders keep the build green.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
